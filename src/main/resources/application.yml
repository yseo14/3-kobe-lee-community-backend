server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ${AWS_REGION} # ap-northeast-2 # 서울 리전
      s3:
        bucket: ${S3_RESOURCES_BUCKET}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none} # 기본값은 none (운영 사고 방지), 개발 시 update로 환경변수 주입 가능
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false # OSIV 종료 (DB 커넥션 고갈 방지, 성능 최적화)

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:} # 비밀번호가 없으면 빈 값, 있으면 주입

  jackson:
    generator:
      escape-non-ascii: false
    serialization:
      fail-on-empty-beans: false
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org.hibernate.SQL: info # debug는 너무 시끄러울 수 있음, 필요시 환경변수로 변경 권장
    org.hibernate.type.descriptor.sql: trace # 바인딩 파라미터 보고 싶을 때 유용

custom:
  cors:
    # 환경변수가 없으면 기본적으로 로컬호스트 허용
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app:
  default-profile-image-id: 1

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000

company:
  name: "katebo kobe(주)"
  contact-email: "kobe@email.com"

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health, info, prometheus # prometheus는 모니터링 시 유용
  endpoint:
    health:
      probes:
        enabled: true